name: Validate NRD Studio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check projects.js
          node --check subtitles.js
          node --check render.js
          node --check sw.js
      - name: Run project smoke checks
        run: node scripts/check-project.mjs
      - name: Test subtitle parser
        run: node scripts/test-subtitles.mjs
      - name: Test renderer capabilities
        run: node scripts/test-render.mjs
